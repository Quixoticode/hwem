<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neuromorphic Liquid</title>
<style>
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);overflow:hidden;-webkit-font-smoothing:antialiased;}
  .cover{position:relative;width:960px;height:288px;overflow:hidden;}
  .band{position:absolute;left:0;top:0;width:960px;height:112px;}
  .cyan{fill:var(--primary);} .amber{fill:var(--secondary);} .violet{fill:var(--accent);} .deep{fill:var(--cyan-600);}
  .blk{rx:var(--radius-glass);}
  .nuc{fill:var(--bg);} .core{fill:var(--text);}
  .dot{fill:var(--primary);}
  .words{position:absolute;left:var(--space-24);right:var(--space-24);bottom:var(--space-24);}
  .name{margin:0;font-family:var(--font-display);font-size:64px;line-height:.95;font-weight:700;letter-spacing:-.02em;color:var(--text);white-space:nowrap;}
  .tag{margin:var(--space-12) 0 0 2px;font-size:14px;line-height:20px;color:var(--muted);max-width:440px;}
</style>
</head>
<body>
<div class="cover">
<svg class="band" viewBox="0 0 960 112" width="960" height="112" aria-hidden="true">
<!--
  blocks      primary 336x136 slab bled off the top (Synaptic Cyan, the identity) · secondary 192x72 (Neural Amber) · accent 96x48 pill once · cyan-600 288x120 bleeding off top and right — the band, ~1/3 of 960x288
  arrangement top-band skeleton (name too wide for the 440 zone): a strip of unequal soft blocks, bottoms staggered, space-16 gutters
  pattern     literal motif row, from "logos behave like dividing cells or synapses": bg nuclei with a text core cut into the cyan and amber blocks (the xSyna nucleus), and a primary dot axon at space-16 pitch
  scales      gutters space-16; corners radius-glass (24 = half the 48 pill); nucleus r = space-8+2 like the mark; dot pitch space-16
-->
<rect class="cyan blk" x="24" y="-24" width="336" height="136" rx="24"/>
<rect class="amber blk" x="376" y="8" width="192" height="72" rx="24"/>
<rect class="violet blk" x="584" y="32" width="96" height="48" rx="24"/>
<rect class="deep blk" x="696" y="-24" width="288" height="120" rx="24"/>
<circle class="nuc" cx="300" cy="56" r="20"/><circle class="core" cx="300" cy="56" r="6"/>
<circle class="nuc" cx="248" cy="56" r="10"/>
<circle class="nuc" cx="532" cy="44" r="10"/><circle class="core" cx="532" cy="44" r="3"/>
<circle class="dot" cx="384" cy="104" r="3"/><circle class="dot" cx="400" cy="104" r="3"/><circle class="dot" cx="416" cy="104" r="3"/><circle class="dot" cx="432" cy="104" r="3"/><circle class="dot" cx="448" cy="104" r="3"/><circle class="dot" cx="464" cy="104" r="3"/><circle class="dot" cx="480" cy="104" r="3"/><circle class="dot" cx="496" cy="104" r="3"/><circle class="dot" cx="512" cy="104" r="3"/><circle class="dot" cx="528" cy="104" r="3"/><circle class="dot" cx="544" cy="104" r="3"/><circle class="dot" cx="560" cy="104" r="3"/><circle class="dot" cx="576" cy="104" r="3"/><circle class="dot" cx="592" cy="104" r="3"/><circle class="dot" cx="608" cy="104" r="3"/><circle class="dot" cx="624" cy="104" r="3"/><circle class="dot" cx="640" cy="104" r="3"/><circle class="dot" cx="656" cy="104" r="3"/><circle class="dot" cx="672" cy="104" r="3"/>
</svg>
<div class="words">
<h1 class="name">Neuromorphic Liquid</h1>
<p class="tag">Every interaction breathes. Every component flows.</p>
</div>
</div>
</body>
</html>
